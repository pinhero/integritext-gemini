<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond sombre arrondi -->
  <rect width="64" height="64" rx="14" fill="#111110"/>

  <!-- Document blanc -->
  <rect x="10" y="8" width="30" height="38" rx="3" fill="#f0f0ee"/>
  <!-- Lignes de texte simulées -->
  <rect x="14" y="15" width="18" height="2" rx="1" fill="#2e2e2b" opacity="0.25"/>
  <rect x="14" y="20" width="22" height="2" rx="1" fill="#2e2e2b" opacity="0.25"/>
  <rect x="14" y="25" width="16" height="2" rx="1" fill="#2e2e2b" opacity="0.25"/>
  <rect x="14" y="30" width="20" height="2" rx="1" fill="#2e2e2b" opacity="0.25"/>
  <!-- Ligne surlignée rouge (plagiat) -->
  <rect x="14" y="35" width="19" height="2.5" rx="1" fill="#ef4444" opacity="0.55"/>

  <!-- Loupe — cercle (détection IA, bleu) -->
  <circle cx="37" cy="37" r="12" fill="none" stroke="#3b82f6" stroke-width="4.5"/>
  <!-- Teinte intérieure bleue légère -->
  <circle cx="37" cy="37" r="7.5" fill="#3b82f6" opacity="0.12"/>
  <!-- Reflet intérieur -->
  <circle cx="34" cy="34" r="2.5" fill="#ffffff" opacity="0.35"/>

  <!-- Manche (détection plagiat, rouge) -->
  <line x1="46" y1="46" x2="56" y2="56" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
</svg>
